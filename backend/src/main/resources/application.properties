spring.application.name=dhakshu-bakes-backend
server.port=8080

# Default Active Profile
spring.profiles.active=dev

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Global CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# App Specific Default Properties
dhakshu.app.jwtSecret=${JWT_SECRET:DhakshuBakesSuperSecretKeyForJwtSigningMustBeAtLeast32BytesLong!}
dhakshu.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
dhakshu.app.razorpayKeyId=${RAZORPAY_KEY_ID:rzp_test_placeholderKeyId}
dhakshu.app.razorpayKeySecret=${RAZORPAY_KEY_SECRET:rzp_test_placeholderKeySecret}
dhakshu.app.razorpayWebhookSecret=${RAZORPAY_WEBHOOK_SECRET:rzp_test_placeholderWebhookSecret}

# Mail Configuration Defaults
spring.mail.enabled=${SPRING_MAIL_ENABLED:false}
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

