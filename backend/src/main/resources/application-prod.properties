# Production PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration for Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false

# Mandatory Secret Keys for Production
dhakshu.app.jwtSecret=${JWT_SECRET}
dhakshu.app.razorpayKeyId=${RAZORPAY_KEY_ID}
dhakshu.app.razorpayKeySecret=${RAZORPAY_KEY_SECRET}
dhakshu.app.razorpayWebhookSecret=${RAZORPAY_WEBHOOK_SECRET}

# Flyway Configuration for Production
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
